[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "quality-data-agent"
path = "src/main.rs"

# The installation's agent (decision 0003): the binary that runs the update
# engine with the real host, made of one adapter per concern (AWS, Docker
# Compose, PostgreSQL, the package files, quality-data's API).
[dependencies]
aws-client.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
index-model.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
updater.workspace = true
ureq.workspace = true

[dev-dependencies]
# To sign test indexes as KMS does (ECDSA P-256, base64 of the DER).
p256.workspace = true
