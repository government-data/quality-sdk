[package]
name = "agent"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "quality-data-agent"
path = "src/main.rs"

# The installation's agent (decision 0003): the binary that runs the update
# engine with the real host, made of one adapter per concern (AWS, Docker
# Compose, PostgreSQL, the package files, quality-data's API).
[dependencies]
aws-client.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
hex.workspace = true
# The SCRAM-SHA-256 verifier of a module's role (decision 0009).
hmac.workspace = true
index-model.workspace = true
module-manifest.workspace = true
# A new key and its certificate request at each renewal of the agent's
# certificate for the `internal` entry point; the key's PKCS #8 PEM.
p256.workspace = true
rand_core.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The OID of SHA-256, which names the request's signature.
sha2 = { workspace = true, features = ["oid"] }
tar.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
updater.workspace = true
ureq.workspace = true
# The agent's certificate for the `internal` entry point: when it ends, and
# the request of its renewal.
x509-cert.workspace = true

[dev-dependencies]
# A test CA and certificates, and a local mTLS server, for the `updater/v1`
# client (ring, as ureq's rustls uses).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
