[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "quality-data-agent"
path = "src/main.rs"

# The installation's agent (decision 0003): the binary that runs the update
# engine with the real host, made of one adapter per concern (AWS, Docker
# Compose, PostgreSQL, the package files, quality-data's API).
[dependencies]
aws-client.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
hex.workspace = true
index-model.workspace = true
module-manifest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
tracing.workspace = true
updater.workspace = true
ureq.workspace = true

[dev-dependencies]
# To sign test indexes as KMS does (ECDSA P-256, base64 of the DER).
p256.workspace = true
# A test CA and certificates, and a local mTLS server, for the `updater/v1`
# client (ring, as ureq's rustls uses).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
