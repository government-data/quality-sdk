[package]
name = "sdk-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "qsdk"
path = "src/main.rs"

# The `qsdk` CLI, the operator's tool (decisions 0001 and 0008): sign an
# installation's enrolment with the installations' CA, revoke it, and
# publish a platform version to the signed index. It uses the agent's
# enrolment code (`agent::enrol`) to check what it signs.
[dependencies]
agent.workspace = true
aws-client.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
index-model.workspace = true
# The packages' manifests, for the images shared with a provider (decision 0011).
module-manifest.workspace = true
p256.workspace = true
rand_core.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The OID of SHA-256, which names the signatures in certificates.
sha2 = { workspace = true, features = ["oid"] }
toml.workspace = true
x509-cert.workspace = true

[dev-dependencies]
# Module packages built in the publish tests (decision 0009, Q11).
flate2.workspace = true
tar.workspace = true
